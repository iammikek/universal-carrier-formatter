name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Run Tests (Docker)
    runs-on: ubuntu-latest
    # Tests run inside the project's Docker container (same as make test).
    # No LLM API keys are set in CI. Tests must mock LlmExtractorService,
    # ChatOpenAI, and MapperGeneratorService; no real LLM calls.

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: development
          load: true
          tags: universal-carrier-formatter-test:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create minimal .env for CI
        run: touch .env

      - name: CLI --help smoke tests (Docker)
        run: |
          docker run --rm -v ${{ github.workspace }}:/workspace -w /workspace -e PYTHONPATH=/workspace universal-carrier-formatter-test:latest python -m src.formatter --help
          docker run --rm -v ${{ github.workspace }}:/workspace -w /workspace -e PYTHONPATH=/workspace universal-carrier-formatter-test:latest python scripts/run_parser.py --help
          docker run --rm -v ${{ github.workspace }}:/workspace -w /workspace -e PYTHONPATH=/workspace universal-carrier-formatter-test:latest python -m src.blueprints.cli --help
          docker run --rm -v ${{ github.workspace }}:/workspace -w /workspace -e PYTHONPATH=/workspace universal-carrier-formatter-test:latest python -m src.mapper_generator_cli --help
          docker run --rm -v ${{ github.workspace }}:/workspace -w /workspace -e PYTHONPATH=/workspace universal-carrier-formatter-test:latest python -m src.openapi_generator --help

      - name: Run type checker (mypy, full src/ — non-blocking, Docker)
        run: |
          docker run --rm -v ${{ github.workspace }}:/workspace -w /workspace -e PYTHONPATH=/workspace universal-carrier-formatter-test:latest mypy src/ 2>&1 | tee mypy_full.log
          code=$?
          line=$(grep -E "Found [0-9]+ error" mypy_full.log || true)
          [ -n "$line" ] && echo "::notice::mypy full (src/): $line"
          exit $code
        continue-on-error: true

      - name: Run type checker (mypy, strict subset src/core/ — blocking, Docker)
        run: docker run --rm -v ${{ github.workspace }}:/workspace -w /workspace -e PYTHONPATH=/workspace universal-carrier-formatter-test:latest mypy src/core/

      - name: Run tests with coverage (Docker)
        run: docker run --rm -v ${{ github.workspace }}:/workspace -w /workspace -e PYTHONPATH=/workspace universal-carrier-formatter-test:latest pytest tests/ -v --cov=src --cov-report=term-missing --cov-report=xml

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          path: |
            coverage.xml
            mypy_full.log
          if-no-files-found: ignore

      - name: Upload coverage to Codecov (optional)
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  build-api:
    name: Build API (Docker)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx (layer cache)
        uses: docker/setup-buildx-action@v3

      - name: Set Docker image name for Compose
        run: echo "IMAGE_NAME=$(basename $GITHUB_WORKSPACE)_app:latest" >> $GITHUB_ENV

      - name: Build Docker image (with cache)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: development
          load: true
          tags: ${{ env.IMAGE_NAME }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create minimal .env for CI
        run: touch .env

      - name: Start API and smoke test
        run: |
          docker compose --profile api up -d api
          sleep 3
          curl -sf http://localhost:8000/health
          docker compose --profile api down

  apidoc:
    name: Build API docs (OpenAPI / Swagger)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Install dependencies (incl. dev for reliable OpenAPI build)
        run: uv sync --frozen --extra dev

      - name: Build openapi.yaml and swagger.json
        run: |
          uv run python -m src.openapi_generator examples/expected_output.json -o docs/openapi.yaml
          uv run python -m src.openapi_generator examples/expected_output.json -o docs/swagger.json --format json
